  - stable_key: active_record.transactions.rollback_behavior
    topic: active-record
    short_title: Transactions and rollback behavior
    prompt: >-
      Explain Active Record transaction rollback behavior, including `ActiveRecord::Rollback`, nested transactions,
      savepoints, and why rescuing a database statement error inside a PostgreSQL transaction is dangerous.
    difficulty: strong_mid
    priority: core
    question_type: production_scenario
    reference_answer: >-
      An exception escaping a transaction block rolls back and is re-raised, except `ActiveRecord::Rollback`, which rolls
      back but is swallowed by the transaction wrapper. Nested transaction blocks usually join the outer transaction, so
      an inner rollback may not roll back outer work. `requires_new: true` uses a savepoint on PostgreSQL and can roll back
      the nested unit. After PostgreSQL reports a statement error, the transaction is aborted until rollback; rescuing
      `ActiveRecord::StatementInvalid` inside the block and continuing leads to further failures. Retry the entire transaction
      at an appropriate boundary, and keep non-database side effects outside or after commit.
    explanation: >-
      Correct transaction reasoning requires distinguishing Ruby exception flow, Rails nesting behavior, and database state.
    common_mistakes: >-
      Assuming every nested block creates a real transaction; expecting ActiveRecord::Rollback to be re-raised; rescuing
      uniqueness violations and continuing; assuming HTTP calls or jobs roll back with SQL.
    active: true
    position: 3
    concepts:
      - stable_key: escaping_exceptions_trigger_rollback_activerecor
        concept: Escaping exceptions trigger rollback; ActiveRecord::Rollback is swallowed.
        weight: 1.5
      - stable_key: nested_blocks_normally_participate_in_the_parent
        concept: Nested blocks normally participate in the parent transaction.
        weight: 1
      - stable_key: requires_new_uses_savepoints_where_supported
