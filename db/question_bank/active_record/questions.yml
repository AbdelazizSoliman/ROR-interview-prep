  - stable_key: active_record.eager_loading.includes_preload_eager_load
    topic: active-record
    short_title: includes vs preload vs eager_load
    prompt: >-
      Compare `includes`, `preload`, and `eager_load` in Active Record. What SQL shapes do they produce, and how can a
      condition on the associated table change the behavior of `includes`?
    difficulty: mid
    priority: core
    question_type: comparison
    reference_answer: >-
      `preload` always loads associations with separate queries and cannot use the association table to filter the parent
      query. `eager_load` uses a `LEFT OUTER JOIN` and reconstructs records from the joined rows. `includes` lets Active
      Record choose: it normally preloads separately, but association-table conditions or explicit `references` can make
      it use a join. A joined condition may also change which associated rows are loaded, so SQL and returned association
      contents must be inspected rather than assuming `includes` is merely a performance hint.
    explanation: >-
      These APIs affect both performance and, once associated-table predicates appear, query semantics.
    common_mistakes: >-
      Saying includes always emits two queries; using preload with an associated-table WHERE clause; overlooking duplicate
      joined rows; assuming eager loading never changes association contents.
    active: true
    position: 1
    concepts:
      - stable_key: preload_uses_separate_association_queries
        concept: preload uses separate association queries.
        weight: 1
      - stable_key: eager_load_uses_a_left_outer_join
        concept: eager_load uses a left outer join.
        weight: 1
