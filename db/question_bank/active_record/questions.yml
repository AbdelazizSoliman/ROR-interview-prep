  - stable_key: active_record.performance.n_plus_one
    topic: active-record
    short_title: Recognizing and fixing N+1 queries
    prompt: >-
      What is an N+1 query problem in Active Record? Show how you would identify it and choose an appropriate fix rather
      than adding eager loading blindly.
    difficulty: junior
    priority: core
    question_type: debugging
    reference_answer: >-
      N+1 occurs when one query loads a collection and accessing an association issues another query for each row.
      Confirm it with query logs, notifications, profiling, or a detector such as Bullet, then preload the association
      when the response actually needs it. Use `includes` for adaptive eager loading, `preload` to force separate queries,
      or `eager_load` when one joined query is required. Select only needed associations and verify query count and memory,
      because eager loading a large graph can replace many queries with excessive rows and allocations.
    explanation: >-
      Query count is evidence, but the right fix also accounts for cardinality, memory, filtering, and the rendered access pattern.
    common_mistakes: >-
      Defining N+1 as any multiple queries; adding includes everywhere; overlooking N+1s in serializers or partials; fixing
      query count while creating a huge joined result.
    active: true
    position: 0
