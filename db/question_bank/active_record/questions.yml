  - stable_key: active_record.queries.joins_vs_eager_loading
    topic: active-record
    short_title: joins vs eager loading
    prompt: >-
      Why does `joins(:comments)` not prevent an N+1 when code later reads each post's comments? Contrast filtering with
      association loading and discuss duplicate parent rows.
    difficulty: mid
    priority: important
    question_type: comparison
    reference_answer: >-
      `joins` changes the SQL used to select the base relation but does not mark the association as loaded. Reading
      `post.comments` can therefore still query once per post. Use joins when related tables are needed for filtering or
      ordering, and use a preload/eager-load strategy when Ruby code needs association objects. A has-many join can produce
      repeated parent rows; `distinct` may be needed for base-record semantics, though it has a cost and does not itself
      preload children. Sometimes `joins(...).preload(...)` intentionally separates filtering from complete association loading.
    explanation: >-
      Joining tables and hydrating an association solve different problems even when their SQL can look similar.
    common_mistakes: >-
      Assuming joins populates associations; adding distinct without understanding why; using joined child predicates while
      expecting all children to be loaded; overlooking pagination distortion from duplicate rows.
    active: true
    position: 2
    concepts:
