  - stable_key: rails.models.callbacks_tradeoffs
    topic: rails
    short_title: Callbacks and when to avoid them
    prompt: >-
      What are appropriate uses for Active Record callbacks, and when do callbacks make a Rails application harder to
      reason about? Describe a safer design for important external side effects.
    difficulty: strong_mid
    priority: important
    question_type: production_scenario
    reference_answer: >-
      Callbacks are suitable for invariants local to the model lifecycle, such as normalizing owned data, when the behavior
      should occur on every relevant persistence path. They become risky when they hide orchestration, depend on request
      context, trigger network calls, or create chains of writes. External side effects should generally be initiated by an
      explicit application/service operation after a successful transaction, often using `after_commit` only to enqueue an
      idempotent job. Explicit orchestration exposes ordering, inputs, error handling, and transaction boundaries.
    explanation: >-
      The issue is not that callbacks are universally bad; it is hidden coupling and ambiguous transactional behavior.
    common_mistakes: >-
      Treating all callbacks as an anti-pattern; sending email in `after_save`; confusing `after_save` with `after_commit`;
      assuming callback failure can roll back an already committed external side effect.
    active: true
    position: 1
    concepts:
      - stable_key: model_local_invariants_can_fit_lifecycle_callbac
        concept: Model-local invariants can fit lifecycle callbacks.
        weight: 1
      - stable_key: hidden_orchestration_increases_coupling_and_surp
