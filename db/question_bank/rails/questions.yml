questions:
  - stable_key: rails.request.request_lifecycle
    topic: rails
    short_title: Rails request lifecycle
    prompt: >-
      Trace an HTTP request through a Rails application from the server receiving it to the response reaching the client.
      Identify where middleware, routing, controllers, rendering, and database access participate.
    difficulty: mid
    priority: core
    question_type: architecture
    reference_answer: >-
      The web server hands a Rack environment to the Rails Rack application. Middleware may inspect or transform the
      request and later the response. The router recognizes the method and path and dispatches to a controller action.
      Controller callbacks and the action run, usually invoking domain or persistence code through Active Record.
      Rails renders a template or serializes a response unless the action already responded. The response then unwinds
      through middleware to the server. Exceptions are handled by configured middleware, and request-scoped execution
      hooks clean up resources such as database connections.
    explanation: >-
      The useful mental model is a Rack call stack, not a direct jump from URL to controller.
    common_mistakes: >-
      Omitting middleware; claiming routes execute controller code; assuming a view always renders; overlooking connection
      checkout/cleanup and exception middleware.
    active: true
    position: 0
