  - stable_key: architecture.tenancy.record_isolation
    topic: architecture
    short_title: Multi-tenant record isolation
    prompt: >-
      Design record isolation for a row-based multi-tenant Rails application. How do you prevent cross-tenant reads and
      writes beyond relying on developers to remember a `where(tenant_id: ...)` clause?
    difficulty: strong_mid
    priority: core
    question_type: architecture
    reference_answer: >-
      Put a non-null tenant key on every tenant-owned row and carry tenant context explicitly through the request and job.
      Scope repository/association entry points from the current tenant rather than querying global classes, and include the
      tenant key in uniqueness constraints and foreign-key design so identifiers cannot cross boundaries. Tests should probe
      hostile cross-tenant IDs. For stronger defense, PostgreSQL row-level security can enforce tenant predicates at the
      database layer, but connection-pool session context must be set and reset safely and privileged roles must be understood.
      Avoid a default scope as the only control because unscoped queries and background execution can bypass it.
    explanation: >-
      Tenant isolation is a security invariant requiring layered enforcement at context, query, schema, and possibly database-policy levels.
    common_mistakes: >-
      Using only controller filters; global uniqueness where tenant-scoped uniqueness is intended; accepting a tenant ID from
      untrusted parameters; leaking tenant session state through pooled connections; treating default_scope as authorization.
    active: true
    position: 1
    concepts:
      - stable_key: tenant_context_must_be_explicit_in_requests_and
        concept: Tenant context must be explicit in requests and asynchronous work.
        weight: 1.5
      - stable_key: queries_should_originate_from_tenant_scoped_asso
        concept: Queries should originate from tenant-scoped associations or repositories.
        weight: 1.5
      - stable_key: constraints_and_keys_should_include_tenant_ident
        concept: Constraints and keys should include tenant identity where appropriate.
        weight: 1
      - stable_key: row_level_security_can_provide_defense_in_depth
        concept: Row-level security can provide defense in depth.
        weight: 1
      - stable_key: connection_pools_require_careful_tenant_context
        concept: Connection pools require careful tenant-context cleanup.
        weight: 1
