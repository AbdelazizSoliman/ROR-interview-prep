questions:
  - stable_key: architecture.jobs.idempotency
    topic: architecture
    short_title: Background job idempotency
    prompt: >-
      A background job may be delivered more than once or retried after partial failure. How would you design it to be
      idempotent, especially when it changes database state and calls an external API?
    difficulty: strong_mid
    priority: core
    question_type: production_scenario
    reference_answer: >-
      Assume at-least-once execution and give the operation a stable idempotency identity. Make database transitions
      conditional and enforce uniqueness where possible, so repeating a completed transition is a no-op. Keep transactions
      short and record durable intent or completion. For external APIs, pass an idempotency key when supported; otherwise
      persist an operation record and reconcile ambiguous outcomes rather than blindly repeating. An outbox can atomically
      record work with domain changes, but consumers must still be idempotent. Retries need bounded backoff, observability,
      and a policy for permanent failures.
    explanation: >-
      Queue acknowledgement cannot make a database and remote service one transaction, so correctness comes from durable state and repeatable operations.
    common_mistakes: >-
      Treating unique job enqueueing as execution idempotency; holding a database transaction open across HTTP; checking then
      inserting without a unique constraint; assuming exactly-once delivery.
    active: true
    position: 0
    concepts:
      - stable_key: background_delivery_should_be_treated_as_at_leas
        concept: Background delivery should be treated as at least once.
        weight: 1.5
